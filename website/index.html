<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacelab — Coming Soon</title>
  <link rel="icon" type="image/png" href="assets/pacelab-brand.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #2c2c2e;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1.125rem;
      color: #a1a1a6;
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #f5f5f7;
      background: #48484a;
      padding: 0.5rem 1rem;
      border-radius: 100px;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="assets/pacelab-brand.png" alt="Pacelab" />
    </div>
    <h1>Pacelab</h1>
    <span class="badge">Coming soon</span>
    <p class="tagline">The running coach in your pocket.</p>
  </div>
</body>
</html>
